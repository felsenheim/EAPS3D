<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lineation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
      max-width: 800px;
    }
    h1, h2, h3 {
      color: #333;
    }
    .image-container {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .image-container img {
      width: 48%;
      height: auto;
      display: block;
    }
    .single-image {
      margin: 20px 0;
      text-align: center;
    }
    .single-image img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>Lineation</h1>

  <h2>Penetrative Secondary Lineation</h2>
  <p>Occurs when foliation is penetrative.</p>
  <div class="image-container">
    <img src="Lineation1.jpg" alt="Example of penetrative secondary lineation (1)">
    <img src="Lineation3.jpg" alt="Example of penetrative secondary lineation (2)">
  </div>

  <h3>Intersection Lineation</h3>
  <p>Line of intersection between two surfaces (bedding and axial‐planar foliation).</p>
  <div class="image-container">
    <img src="Lineation2.jpg" alt="Intersection lineation between bedding and foliation (1)">
    <img src="Lineation4.jpg" alt="Intersection lineation between bedding and foliation (2)">
  </div>

  <h3>Pencil Structures</h3>
  <div class="single-image">
    <img src="Lineation5.jpg" alt="Pencil structure lineation example">
  </div>

</body>
</html>
